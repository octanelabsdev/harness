site_name: harness
site_description: A stack-agnostic engineering harness for Claude Code — enforcement hooks, guardrail playbooks, and a PM delivery pipeline. Bring your own agents.
site_url: https://harness.octanelabs.dev/
repo_url: https://github.com/octanelabsdev/harness
repo_name: octanelabsdev/harness
edit_uri: edit/main/docs/
copyright: MIT-licensed. Built and maintained by Octane Labs.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Concepts & architecture: concepts.md
      - Working with the harness: workflow.md
      - Cycles: cycles.md
      - Examples: examples.md
  - Guides:
      - Choosing a lane: guides/index.md
      - A small fix: guides/small-fix.md
      - A story: guides/story.md
      - A client project as a cycle: guides/client-cycle.md
  - Reference:
      - Components (hooks & skills): components.md
      - Configuration: configuration.md
      - Bring-your-own agents: agents.md
  - Help:
      - Troubleshooting & FAQ: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/syntax.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/octanelabsdev/harness
